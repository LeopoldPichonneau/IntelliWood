<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="Step 3: Start the broker and listen">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fc16a"/><stop offset="1" stop-color="#8fc16a"/></linearGradient></defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .l { white-space: pre; opacity: 0; animation: show 14s linear infinite; }
    @keyframes show { 0% {opacity:0; transform: translateX(-8px)} 3% {opacity:1; transform:none} 90% {opacity:1} 96%,100% {opacity:0} }
    .p { fill:#8fc16a } .c { fill:#8fc16a } .o { fill:#eeeeee } .m { fill:#9e9e9e } .k { fill:#8fc16a }
    .cur { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; } @keyframes spin { to { transform: rotate(360deg) } }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: prog 14s linear infinite; } @keyframes prog { from { transform: scaleX(0) } 85%,100% { transform: scaleX(1) } }
  </style>
  <rect x="1" y="1" width="758" height="278" rx="18" fill="#0d0d0d" stroke="#3b3b3b"/>
  <rect x="1" y="1" width="758" height="278" rx="18" fill="none" stroke="url(#g)" stroke-opacity=".0"/>
  <circle class="ring" cx="48" cy="48" r="27" fill="none" stroke="#8fc16a" stroke-opacity=".6" stroke-dasharray="3 6"/>
  <circle cx="48" cy="48" r="20" fill="#8fc16a" fill-opacity=".12"/>
  <text x="48" y="54" font-size="17" font-weight="800" text-anchor="middle" fill="#8fc16a">3</text>
  <text x="92" y="44" font-size="20" font-weight="800" fill="#eeeeee">Start the broker and listen</text>
  <text x="92" y="66" font-size="13" fill="#9e9e9e">Watch your sensors publish in real time</text>
  <text x="732" y="40" font-size="11" letter-spacing="2" text-anchor="end" fill="#9e9e9e">STEP 3 / 3</text>
  <rect x="636" y="50" width="96" height="4" rx="2" fill="#191919"/><rect class="bar" x="636" y="50" width="96" height="4" rx="2" fill="url(#g)"/>
  <rect x="24" y="96" width="712" height="170" rx="12" fill="#0c0c0c" stroke="#3b3b3b"/>
  <text class="l" style="animation-delay:0.5s" x="44" y="126" font-size="14"><tspan class="p">$</tspan> <tspan class="c">mqtt_starter scanif</tspan><tspan class="m">   # in a separate terminal</tspan></text>
<text class="l" style="animation-delay:1.2s" x="44" y="150" font-size="14"><tspan class="p">$</tspan> <tspan class="c">mqtt_listen</tspan></text>
<text class="l" style="animation-delay:1.9s" x="44" y="174" font-size="14"><tspan class="m"># example output</tspan></text>
<text class="l" style="animation-delay:2.6s" x="44" y="198" font-size="14"><tspan class="o">Flame-detector/flame    no flame</tspan></text>
<text class="l" style="animation-delay:3.3s" x="44" y="222" font-size="14"><tspan class="o">PIR-detector/pir        no motion</tspan></text>
<text class="l" style="animation-delay:4.0s" x="44" y="246" font-size="14"><tspan class="o">smoke-sensor/smoke      no smoke</tspan></text>
</svg>